[build-system]
requires = ["setuptools", "wheel", "setuptools_scm"]  # Build requirements
build-backend = "setuptools.build_meta"

[project]
name = "yelp_predict"
dynamic = ["version"]
description = "this package provides function/classes needed for the yelp restaurant rating prediction project"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "Yuhao Huo", email = "martinyuhaohuo@gmail.com" }
]
keywords = ["machine learning", "prediction", "business rating"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries"
]

# Runtime dependencies, can also specifiy outside package version here
dependencies = [
    "numpy",
    "pandas",
    "polars",
    "pyarrow",
    "glum",
    "lightgbm",
    "scikit-learn",
    "dalex",
    "kaleido",
    "plotly",
    "matplotlib",
    "geopy"
]

[project.urls]
"Source" = "https://github.com/martinyuhaohuo/d100_d400_project"
"Issues" = "https://github.com/martinyuhaohuo/d100_d400_project/issues"


[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "no-local-version"
write_to = "yelp_predict/version.py"

[tool.setuptools.packages.find]
where = ["."] # search for package in the project root
